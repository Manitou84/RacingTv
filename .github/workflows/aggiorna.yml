name: Aggiorna dati RacingTv

on:
  schedule:
    - cron: "*/30 * * * *"   # ogni mezz'ora (GitHub può ritardare di qualche minuto)
  workflow_dispatch: {}       # pulsante "Run workflow" per aggiornare a mano
  push:                       # parte anche quando cambiano gli script o la configurazione
    branches: [main]
    paths: ["scripts/**", "config/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prova dei lettori
        run: node scripts/test.mjs
      - name: Scarica notizie, orari TV8 e classifiche (MotoGP, F1 e Superbike)
        run: node scripts/aggiorna.mjs
      - name: Ridisegna le mappe nuove in stile grafica TV
        run: |
          if ls docs/mappe/*.png >/dev/null 2>&1 && python3 -c "import json,os,sys; m=json.load(open('docs/data/mappe.json')); sys.exit(0 if any('stile' not in v for v in m.values()) else 1)"; then
            pip install --quiet --disable-pip-version-check pillow numpy scipy && python3 scripts/stilizza_mappe.py
          fi
      - name: Salva i dati se sono cambiati
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data docs/tv8.ics docs/mappe config/cache-stagioni.json config/debug-gp.html
          git diff --cached --quiet || (git commit -m "Aggiorna dati $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
