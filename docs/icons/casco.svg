<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96">
  <!-- casco integrale da pista visto di lato, disegno originale nei colori di RacingTv -->
  <defs>
    <linearGradient id="calotta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d68"/><stop offset=".55" stop-color="#e4002b"/><stop offset="1" stop-color="#9e0019"/>
    </linearGradient>
    <linearGradient id="visiera" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a6372"/><stop offset=".35" stop-color="#14171c"/><stop offset=".75" stop-color="#0b0d10"/><stop offset="1" stop-color="#2aa4c0"/>
    </linearGradient>
    <linearGradient id="nero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d33"/><stop offset="1" stop-color="#0c0d10"/></linearGradient>
    <clipPath id="forma"><path d="M16 80 C6 72 3 56 8 40 C13 24 30 9 56 6 C76 4 96 10 107 26 C111 32 113 38 114 44 C117 50 119 57 118 64 C117 72 113 78 106 80 L90 82 C84 82 80 84 76 86 L42 88 C30 88 22 86 16 80 Z"/></clipPath>
  </defs>
  <!-- ombra -->
  <ellipse cx="62" cy="91" rx="46" ry="3.5" fill="#000" opacity=".35"/>
  <!-- spoiler posteriore -->
  <path d="M26 16 C18 16 8 18 1 22 C4 28 9 34 14 38 C14 30 18 22 26 16 Z" fill="url(#nero)" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- calotta -->
  <path d="M16 80 C6 72 3 56 8 40 C13 24 30 9 56 6 C76 4 96 10 107 26 C111 32 113 38 114 44 C117 50 119 57 118 64 C117 72 113 78 106 80 L90 82 C84 82 80 84 76 86 L42 88 C30 88 22 86 16 80 Z" fill="url(#calotta)"/>
  <g clip-path="url(#forma)">
    <!-- grafica: fascia gialla e filetti bianchi che corrono verso la visiera -->
    <path d="M-4 70 C18 52 40 30 74 22 C88 19 100 20 112 24 L112 32 C98 28 86 28 74 31 C46 38 26 58 4 80 Z" fill="#ffd23f"/>
    <path d="M-4 82 C20 62 42 42 72 35" fill="none" stroke="#fff" stroke-width="2.4"/>
    <path d="M30 14 C44 9 62 8 78 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".28"/>
    <!-- parte bassa e mentoniera scure -->
    <path d="M8 74 C28 79 50 80 70 76 C86 72 100 64 120 60 L120 100 L0 100 Z" fill="url(#nero)"/>
  </g>
  <!-- bordo della calotta -->
  <path d="M16 80 C6 72 3 56 8 40 C13 24 30 9 56 6 C76 4 96 10 107 26 C111 32 113 38 114 44 C117 50 119 57 118 64 C117 72 113 78 106 80 L90 82 C84 82 80 84 76 86 L42 88 C30 88 22 86 16 80 Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- visiera -->
  <path d="M54 36 C56 31 63 29 72 29 C88 29 102 33 112 40 C115 45 115 51 113 55 C100 54 84 54 68 56 C60 57 55 53 53 46 Z" fill="url(#visiera)" stroke="#0b0d10" stroke-width="1.6"/>
  <path d="M62 36 C74 34 88 35 102 39" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
  <!-- perno e linguetta della visiera -->
  <circle cx="52" cy="45" r="4.2" fill="#1a1c20" stroke="#fff" stroke-width="1.4"/>
  <rect x="107" y="53" width="7" height="3.2" rx="1.2" fill="#ffd23f"/>
  <!-- prese d'aria: frontale in alto e sulla mentoniera -->
  <path d="M70 12 L84 11 L86 15 L72 16 Z" fill="#14161a"/>
  <path d="M104 63 L114 62 M104 67 L114 66 M104 71 L112 70" stroke="#ffd23f" stroke-width="1.8" stroke-linecap="round"/>
  <!-- bordino del collo -->
  <path d="M18 81 C26 86 34 88 42 88 L76 86" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
</svg>
